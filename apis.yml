name: Zepz
description: >-
  Zepz (formerly WorldRemit Group) is a London-headquartered cross-border
  payments and remittance fintech that operates the consumer money-transfer
  brands WorldRemit and Sendwave. Through its mobile apps and website, Zepz lets
  migrants and their families send money from ~50 sending countries to 130+
  receiving countries via bank deposit, mobile money, cash pickup, and airtime
  top-up, processing tens of millions of transactions and roughly $10B in annual
  customer transfers. Zepz is a direct-to-consumer app business: it publishes no
  public developer portal, OpenAPI, or partner integration API. This profile was
  added as an Accel portfolio-company lead; enrichment confirms there is no
  public API surface to catalog at this time.
